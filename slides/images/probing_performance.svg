<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <!-- Background -->
  <rect width="500" height="320" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="250" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Expected Probes vs Load Factor (α)</text>

  <!-- Axes -->
  <line x1="60" y1="270" x2="460" y2="270" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="270" x2="60" y2="50" stroke="#333" stroke-width="2"/>

  <!-- X-axis labels -->
  <text x="60" y="290" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
  <text x="140" y="290" text-anchor="middle" font-family="sans-serif" font-size="11">0.2</text>
  <text x="220" y="290" text-anchor="middle" font-family="sans-serif" font-size="11">0.4</text>
  <text x="300" y="290" text-anchor="middle" font-family="sans-serif" font-size="11">0.6</text>
  <text x="380" y="290" text-anchor="middle" font-family="sans-serif" font-size="11">0.8</text>
  <text x="450" y="290" text-anchor="middle" font-family="sans-serif" font-size="11">1.0</text>
  <text x="260" y="310" text-anchor="middle" font-family="sans-serif" font-size="12">Load Factor (α = n/m)</text>

  <!-- Y-axis labels -->
  <text x="50" y="270" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
  <text x="50" y="214" text-anchor="end" font-family="sans-serif" font-size="11">5</text>
  <text x="50" y="158" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
  <text x="50" y="102" text-anchor="end" font-family="sans-serif" font-size="11">15</text>
  <text x="50" y="55" text-anchor="end" font-family="sans-serif" font-size="11">20</text>
  <text x="25" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90, 25, 160)">Expected Probes</text>

  <!-- Grid lines -->
  <line x1="60" y1="214" x2="460" y2="214" stroke="#ddd" stroke-width="1"/>
  <line x1="60" y1="158" x2="460" y2="158" stroke="#ddd" stroke-width="1"/>
  <line x1="60" y1="102" x2="460" y2="102" stroke="#ddd" stroke-width="1"/>

  <!-- Vertical line at α = 2/3 -->
  <line x1="327" y1="50" x2="327" y2="270" stroke="#f39c12" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="327" y="45" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#f39c12">α = 2/3</text>

  <!-- Linear probing unsuccessful: ½(1 + 1/(1-α)²) -->
  <!-- Points: α=0→1, α=0.2→1.28, α=0.4→1.89, α=0.5→2.5, α=0.6→3.63, α=0.67→5.06, α=0.8→13, α=0.9→50.5 -->
  <path d="M 60 259
           C 100 257, 140 253, 180 247
           C 220 238, 260 220, 300 185
           C 320 160, 340 110, 360 50"
        fill="none" stroke="#e74c3c" stroke-width="3"/>

  <!-- Separate chaining unsuccessful: 1 + α -->
  <!-- Points: α=0→1, α=0.5→1.5, α=1→2 -->
  <path d="M 60 259 L 460 248"
        fill="none" stroke="#27ae60" stroke-width="3"/>

  <!-- Double hashing unsuccessful: 1/(1-α) -->
  <!-- Points: α=0→1, α=0.5→2, α=0.67→3, α=0.8→5, α=0.9→10 -->
  <path d="M 60 259
           C 140 255, 220 247, 280 230
           C 320 210, 350 175, 380 120
           C 400 80, 420 50, 430 30"
        fill="none" stroke="#3498db" stroke-width="3"/>

  <!-- Legend -->
  <rect x="280" y="65" width="170" height="75" fill="white" stroke="#ccc" stroke-width="1" rx="5"/>
  <line x1="290" y1="82" x2="320" y2="82" stroke="#e74c3c" stroke-width="3"/>
  <text x="330" y="86" font-family="sans-serif" font-size="11">Linear probing</text>
  <line x1="290" y1="102" x2="320" y2="102" stroke="#3498db" stroke-width="3"/>
  <text x="330" y="106" font-family="sans-serif" font-size="11">Double hashing</text>
  <line x1="290" y1="122" x2="320" y2="122" stroke="#27ae60" stroke-width="3"/>
  <text x="330" y="126" font-family="sans-serif" font-size="11">Separate chaining</text>
</svg>
