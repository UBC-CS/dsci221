<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220">
  <!-- Slot 0: empty -->
  <rect x="20" y="10" width="40" height="28" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="10" y="28" text-anchor="end" font-family="monospace" font-size="12" fill="#666">0</text>
  <text x="40" y="28" text-anchor="middle" font-family="monospace" font-size="11" fill="#999">[ ]</text>

  <!-- Slot 1: [8, 29, 22] -->
  <rect x="20" y="38" width="40" height="28" fill="#aed6f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="10" y="56" text-anchor="end" font-family="monospace" font-size="12" fill="#666">1</text>
  <!-- Python list representation -->
  <rect x="70" y="38" width="120" height="28" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="3"/>
  <text x="130" y="56" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e8449">[8, 29, 22]</text>
  <!-- Arrow -->
  <line x1="60" y1="52" x2="68" y2="52" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Slot 2: [16] -->
  <rect x="20" y="66" width="40" height="28" fill="#aed6f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="10" y="84" text-anchor="end" font-family="monospace" font-size="12" fill="#666">2</text>
  <rect x="70" y="66" width="50" height="28" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="3"/>
  <text x="95" y="84" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e8449">[16]</text>
  <line x1="60" y1="80" x2="68" y2="80" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Slot 3: empty -->
  <rect x="20" y="94" width="40" height="28" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="10" y="112" text-anchor="end" font-family="monospace" font-size="12" fill="#666">3</text>
  <text x="40" y="112" text-anchor="middle" font-family="monospace" font-size="11" fill="#999">[ ]</text>

  <!-- Slot 4: [4, 11] -->
  <rect x="20" y="122" width="40" height="28" fill="#aed6f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="10" y="140" text-anchor="end" font-family="monospace" font-size="12" fill="#666">4</text>
  <rect x="70" y="122" width="80" height="28" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="3"/>
  <text x="110" y="140" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e8449">[4, 11]</text>
  <line x1="60" y1="136" x2="68" y2="136" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Slot 5: empty -->
  <rect x="20" y="150" width="40" height="28" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="10" y="168" text-anchor="end" font-family="monospace" font-size="12" fill="#666">5</text>
  <text x="40" y="168" text-anchor="middle" font-family="monospace" font-size="11" fill="#999">[ ]</text>

  <!-- Slot 6: [13] -->
  <rect x="20" y="178" width="40" height="28" fill="#aed6f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="10" y="196" text-anchor="end" font-family="monospace" font-size="12" fill="#666">6</text>
  <rect x="70" y="178" width="50" height="28" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="3"/>
  <text x="95" y="196" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e8449">[13]</text>
  <line x1="60" y1="192" x2="68" y2="192" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2c3e50"/>
    </marker>
