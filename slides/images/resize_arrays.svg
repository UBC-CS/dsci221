<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <!-- Array of size 8 (same cell size as 16-element array: 22x24) -->
  <text x="20" y="20" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Before (m = 8)</text>

  <g transform="translate(20, 30)">
    <rect x="0" y="0" width="22" height="24" fill="#aed6f1" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="11" y="16" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e8449">A</text>

    <rect x="22" y="0" width="22" height="24" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>

    <rect x="44" y="0" width="22" height="24" fill="#aed6f1" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="55" y="16" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e8449">B</text>

    <rect x="66" y="0" width="22" height="24" fill="#aed6f1" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="77" y="16" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e8449">C</text>

    <rect x="88" y="0" width="22" height="24" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>

    <rect x="110" y="0" width="22" height="24" fill="#aed6f1" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="121" y="16" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e8449">D</text>

    <rect x="132" y="0" width="22" height="24" fill="#aed6f1" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="143" y="16" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e8449">E</text>

    <rect x="154" y="0" width="22" height="24" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>

    <!-- Index labels -->
    <text x="11" y="38" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">0</text>
    <text x="33" y="38" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">1</text>
    <text x="55" y="38" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">2</text>
    <text x="77" y="38" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">3</text>
    <text x="99" y="38" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">4</text>
    <text x="121" y="38" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">5</text>
    <text x="143" y="38" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">6</text>
    <text x="165" y="38" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">7</text>
  </g>

  <!-- Arrow with more whitespace -->
  <path d="M 110 95 L 110 130" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="125" y="118" font-family="sans-serif" font-size="11" fill="#e74c3c" font-weight="bold">resize!</text>

  <!-- Array of size 16 -->
  <text x="20" y="160" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">After (m = 16)</text>

  <g transform="translate(20, 170)">
    <rect x="0" y="0" width="22" height="24" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
    <rect x="22" y="0" width="22" height="24" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
    <rect x="44" y="0" width="22" height="24" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
    <rect x="66" y="0" width="22" height="24" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
    <rect x="88" y="0" width="22" height="24" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
    <rect x="110" y="0" width="22" height="24" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
    <rect x="132" y="0" width="22" height="24" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
    <rect x="154" y="0" width="22" height="24" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
    <rect x="176" y="0" width="22" height="24" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
    <rect x="198" y="0" width="22" height="24" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
    <rect x="220" y="0" width="22" height="24" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
    <rect x="242" y="0" width="22" height="24" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
    <rect x="264" y="0" width="22" height="24" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
    <rect x="286" y="0" width="22" height="24" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
    <rect x="308" y="0" width="22" height="24" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
    <rect x="330" y="0" width="22" height="24" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>
