<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold">Hash Table</text>

  <!-- Key input -->
  <rect x="30" y="100" width="80" height="40" rx="5" fill="#e8f4f8" stroke="#2c3e50" stroke-width="2"/>
  <text x="70" y="125" text-anchor="middle" font-family="monospace" font-size="14">"apple"</text>
  <text x="70" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">key</text>

  <!-- Arrow to hash function -->
  <line x1="110" y1="120" x2="140" y2="120" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Hash function box -->
  <rect x="140" y="95" width="80" height="50" rx="5" fill="#f39c12" stroke="#d35400" stroke-width="2"/>
  <text x="180" y="115" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white">hash(key)</text>
  <text x="180" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white">% m</text>

  <!-- Arrow to array -->
  <line x1="220" y1="120" x2="250" y2="120" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Index label -->
  <text x="235" y="110" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#666">index</text>

  <!-- Array -->
  <g transform="translate(260, 50)">
    <text x="50" y="-5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">array</text>

    <!-- Slot 0 -->
    <rect x="0" y="10" width="100" height="30" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
    <text x="-15" y="30" text-anchor="middle" font-family="monospace" font-size="11" fill="#666">0</text>

    <!-- Slot 1 -->
    <rect x="0" y="40" width="100" height="30" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
    <text x="-15" y="60" text-anchor="middle" font-family="monospace" font-size="11" fill="#666">1</text>

    <!-- Slot 2 (highlighted - this is where "apple" goes) -->
    <rect x="0" y="70" width="100" height="30" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="-15" y="90" text-anchor="middle" font-family="monospace" font-size="11" fill="#666">2</text>
    <text x="50" y="90" text-anchor="middle" font-family="monospace" font-size="11" fill="white">"apple": 42</text>

    <!-- Slot 3 -->
    <rect x="0" y="100" width="100" height="30" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
    <text x="-15" y="120" text-anchor="middle" font-family="monospace" font-size="11" fill="#666">3</text>

    <!-- Slot 4 -->
    <rect x="0" y="130" width="100" height="30" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
    <text x="-15" y="150" text-anchor="middle" font-family="monospace" font-size="11" fill="#666">4</text>

    <!-- Slot 5 -->
    <rect x="0" y="160" width="100" height="30" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
    <text x="-15" y="180" text-anchor="middle" font-family="monospace" font-size="11" fill="#666">5</text>

    <!-- Ellipsis -->
    <text x="50" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">...</text>
  </g>

  <!-- Arrow from hash to specific slot -->
  <path d="M 235 125 Q 250 150 270 130" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>
