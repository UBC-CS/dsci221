<svg viewBox="0 0 280 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Grid background -->
  <defs>
    <pattern id="grid-parent" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="280" height="240" fill="url(#grid-parent)"/>

  <!-- Start cell highlight -->
  <rect x="40" y="40" width="40" height="40" fill="#a8e6cf" stroke="#27ae60" stroke-width="2"/>

  <!-- End cell highlight -->
  <rect x="200" y="160" width="40" height="40" fill="#ffd3b6" stroke="#e74c3c" stroke-width="2"/>

  <!-- Grid lines on top -->
  <g stroke="#bdc3c7" stroke-width="1" fill="none">
    <line x1="40" y1="0" x2="40" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="240"/>
    <line x1="0" y1="40" x2="280" y2="40"/>
    <line x1="0" y1="80" x2="280" y2="80"/>
    <line x1="0" y1="120" x2="280" y2="120"/>
    <line x1="0" y1="160" x2="280" y2="160"/>
    <line x1="0" y1="200" x2="280" y2="200"/>
    <rect x="0" y="0" width="280" height="240"/>
  </g>

  <!-- Parent pointer triangles - smaller (8px wide, 6px tall), near the edge they point to -->
  <!-- Cell size is 40x40, cell origins at col*40, row*40 -->
  <!-- Triangles sit 4px from the edge they point toward -->

  <g fill="#8e44ad">
    <!-- Row 0 (y=0-40): parents are in row 1, triangles point DOWN, near bottom edge -->
    <!-- Bottom edge at y=40, triangle tip at y=36, base at y=30 -->
    <polygon points="16,30 24,30 20,36"/>   <!-- (0,0) cx=20 -->
    <polygon points="56,30 64,30 60,36"/>   <!-- (0,1) cx=60 -->
    <polygon points="96,30 104,30 100,36"/> <!-- (0,2) cx=100 -->
    <polygon points="136,30 144,30 140,36"/> <!-- (0,3) cx=140 -->
    <polygon points="176,30 184,30 180,36"/> <!-- (0,4) cx=180 -->
    <polygon points="216,30 224,30 220,36"/> <!-- (0,5) cx=220 -->
    <polygon points="256,30 264,30 260,36"/> <!-- (0,6) cx=260 -->

    <!-- Row 1 (y=40-80): parents point toward S at (1,1) -->
    <!-- (1,0) parent is right -> triangle points RIGHT, near right edge (x=40) -->
    <!-- Right edge at x=40, triangle tip at x=36, base at x=30 -->
    <polygon points="30,56 30,64 36,60"/>   <!-- (1,0) cy=60 -->
    <!-- (1,1) is S - no arrow -->
    <!-- (1,2) parent is left -> triangle points LEFT, near left edge (x=80) -->
    <!-- Left edge at x=80, triangle tip at x=84, base at x=90 -->
    <polygon points="90,56 90,64 84,60"/>  <!-- (1,2) cy=60 -->
    <polygon points="130,56 130,64 124,60"/> <!-- (1,3) -->
    <polygon points="170,56 170,64 164,60"/> <!-- (1,4) -->
    <polygon points="210,56 210,64 204,60"/> <!-- (1,5) -->
    <polygon points="250,56 250,64 244,60"/> <!-- (1,6) -->

    <!-- Row 2 (y=80-120): parents in row 1, triangles point UP, near top edge -->
    <!-- Top edge at y=80, triangle tip at y=84, base at y=90 -->
    <polygon points="16,90 24,90 20,84"/>   <!-- (2,0) -->
    <polygon points="56,90 64,90 60,84"/>   <!-- (2,1) -->
    <polygon points="96,90 104,90 100,84"/> <!-- (2,2) -->
    <polygon points="136,90 144,90 140,84"/> <!-- (2,3) -->
    <polygon points="176,90 184,90 180,84"/> <!-- (2,4) -->
    <polygon points="216,90 224,90 220,84"/> <!-- (2,5) -->
    <polygon points="256,90 264,90 260,84"/> <!-- (2,6) -->

    <!-- Row 3 (y=120-160): parents in row 2, triangles point UP, near top edge -->
    <!-- Top edge at y=120, triangle tip at y=124, base at y=130 -->
    <polygon points="16,130 24,130 20,124"/>   <!-- (3,0) -->
    <polygon points="56,130 64,130 60,124"/>   <!-- (3,1) -->
    <polygon points="96,130 104,130 100,124"/> <!-- (3,2) -->
    <polygon points="136,130 144,130 140,124"/> <!-- (3,3) -->
    <polygon points="176,130 184,130 180,124"/> <!-- (3,4) -->
    <polygon points="216,130 224,130 220,124"/> <!-- (3,5) -->
    <polygon points="256,130 264,130 260,124"/> <!-- (3,6) -->

    <!-- Row 4 (y=160-200): parents in row 3, triangles point UP, near top edge -->
    <!-- Top edge at y=160, triangle tip at y=164, base at y=170 -->
    <polygon points="16,170 24,170 20,164"/>   <!-- (4,0) -->
    <polygon points="56,170 64,170 60,164"/>   <!-- (4,1) -->
    <polygon points="96,170 104,170 100,164"/> <!-- (4,2) -->
    <polygon points="136,170 144,170 140,164"/> <!-- (4,3) -->
    <polygon points="176,170 184,170 180,164"/> <!-- (4,4) -->
    <polygon points="216,170 224,170 220,164"/> <!-- (4,5)=E -->
    <polygon points="256,170 264,170 260,164"/> <!-- (4,6) -->

    <!-- Row 5 (y=200-240): parents in row 4, triangles point UP, near top edge -->
    <!-- Top edge at y=200, triangle tip at y=204, base at y=210 -->
    <polygon points="16,210 24,210 20,204"/>   <!-- (5,0) -->
    <polygon points="56,210 64,210 60,204"/>   <!-- (5,1) -->
    <polygon points="96,210 104,210 100,204"/> <!-- (5,2) -->
    <polygon points="136,210 144,210 140,204"/> <!-- (5,3) -->
    <polygon points="176,210 184,210 180,204"/> <!-- (5,4) -->
    <polygon points="216,210 224,210 220,204"/> <!-- (5,5) -->
    <polygon points="256,210 264,210 260,204"/> <!-- (5,6) -->
  </g>

  <!-- S label (no triangle here) -->
  <text x="60" y="68" text-anchor="middle" font-size="20" font-weight="bold" fill="#27ae60">S</text>

  <!-- E label -->
  <text x="220" y="188" text-anchor="middle" font-size="20" font-weight="bold" fill="#e74c3c">E</text>
</svg>
